name: Bug report
description: Something in Portia did not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest steps that show it. Redact ticket contents you cannot share.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: portia version
      description: Output of `portia version`.
    validations:
      required: true
  - type: dropdown
    id: tracker
    attributes:
      label: Tracker
      options: [GitHub Issues, Jira]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, `bun --version`, `claude --version`, `gh --version`.
  - type: textarea
    id: log
    attributes:
      label: Run log
      description: The relevant rows of `~/.portia/runs/<KEY>/` or the CLI output.
      render: text
